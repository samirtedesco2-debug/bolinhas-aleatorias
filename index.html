<!doctype html>
<html lang="pt-Br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Pista de Bolinhas</title>
  </head>
  <body>
    <header class="contentHeader">
      <div class="totalBolas">
        <label class="labelTotal" for="total">Total de Bola na pista:</label>
        <p class="total" id="totalBolls">0</p>
      </div>

      <div class="insertBolas">
        <label for="inserirBolas">Inserir Bolas:</label>
        <input
          class="inputs"
          type="number"
          step="1"
          min="0"
          name="inserirBolas"
          id="inserirBolas"
        />
        <div class="btns">
          <button class="btn" id="btn-insert">Inserir</button>
        </div>
      </div>

      <div class="deletarBolas">
        <label for="deletBolas">Deletar Bolas:</label>
        <input
          class="inputs"
          type="number"
          step="1"
          min="0"
          name="deletBolas"
          id="deletBolas"
        />
        <div class="btns">
          <button class="btn" id="btn-deletar">Deletar</button>
          <button class="btn" id="btn-limpar">Limpar</button>
        </div>
      </div>
    </header>
    <main id="pistaDeBolinhas"></main>

    <script src="script.js"></script>
  </body>
</html>
